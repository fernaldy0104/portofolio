<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio - Felice Fernaldy</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

    <style>
        .font-portfolio {
            font-family: 'Oswald', sans-serif;
            letter-spacing: -0.01em;
        }

        .font-body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .bg-grid-pattern {
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(0, 56, 95, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 56, 95, 0.05) 1px, transparent 1px);
        }

        .shadow-solid {
            box-shadow: 5px 5px 0px 0px #00233D;
        }

        .shadow-solid-lg {
            box-shadow: 8px 8px 0px 0px #00233D;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 font-body min-h-screen bg-grid-pattern relative flex flex-col justify-between overflow-x-hidden p-6">

    <!-- NAVBAR -->
    <nav class="w-full max-w-6xl mx-auto flex items-center justify-end py-4 z-20">

        <div class="flex items-center gap-6 font-bold text-sm text-slate-600">

            <a href="index.html"
               class="text-[#00385F] font-extrabold border-b-2 border-[#00385F] pb-0.5">
                Home Page
            </a>

            <a href="about.html"
               class="hover:text-[#00385F] transition-colors">
                About
            </a>

            <a href="projects.html"
               class="hover:text-[#00385F] transition-colors">
                Project
            </a>

            <a href="contact.html"
               class="bg-[#00385F] text-white px-5 py-2.5 rounded-xl hover:bg-[#002845] transition-all shadow-solid text-xs uppercase tracking-wider font-extrabold">
                Contact
            </a>

        </div>
    </nav>


    <!-- HERO / BERANDA -->
    <main class="max-w-6xl w-full mx-auto my-auto flex flex-col md:flex-row items-center justify-between gap-10 z-10 py-8">

        <!-- Ornamen Lingkaran Kuning Atas -->
        <div class="absolute top-20 left-[45%] w-5 h-5 bg-[#FFC700] rounded-full pointer-events-none animate-bounce"></div>

        <!-- Ornamen Bintang Merah-Oranye Atas Kanan -->
        <div class="absolute top-16 right-16 text-orange-600 text-3xl font-bold select-none pointer-events-none">
            ✦
        </div>

        <!-- Ornamen Bintang Hijau Bawah Tengah -->
        <div class="absolute bottom-16 left-[50%] text-emerald-500 text-2xl font-bold select-none pointer-events-none">
            ✦
        </div>

        <!-- Ornamen Lingkaran Biru Tua Bawah Kanan -->
        <div class="absolute bottom-24 right-12 w-4 h-4 bg-[#00385F] rounded-full pointer-events-none"></div>


        <!-- SISI KIRI -->
        <div class="flex flex-col items-start gap-6 max-w-xl">

            <!-- Judul -->
            <h1 class="font-portfolio text-7xl md:text-8xl lg:text-9xl text-[#00385F] uppercase font-bold leading-none tracking-tight">
                Portofolio
            </h1>

            <!-- Nama -->
            <div class="bg-[#00385F] text-white px-8 py-3.5 rounded-xl text-2xl md:text-3xl font-extrabold tracking-wider uppercase shadow-solid border-2 border-[#00233D]">
                Felice Fernaldy
            </div>

            <!-- Tombol -->
            <div class="flex items-center gap-4 pt-2">

                <a href="contact.html"
                   class="bg-[#FFC700] hover:bg-[#e6b300] text-[#00385F] font-extrabold px-7 py-3.5 rounded-xl shadow-solid transition-all transform hover:-translate-y-0.5 active:translate-y-0 border-2 border-[#00385F]">
                    Contact Me
                </a>

                <a href="about.html"
                   class="bg-white hover:bg-slate-100 text-[#00385F] border-2 border-[#00385F] font-bold px-7 py-3.5 rounded-xl transition-all shadow-solid">
                    About Me
                </a>

            </div>

        </div>


        <!-- SISI KANAN: FOTO -->
        <div class="relative mt-6 md:mt-0">

            <!-- Dot Grid Atas Kiri -->
            <div class="absolute -top-8 -left-8 grid grid-cols-5 gap-2 opacity-80 z-0">

                <div class="w-1.5 h-1.5 bg-[#00385F] rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-[#00385F] rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-[#00385F] rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-[#00385F] rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-[#00385F] rounded-full"></div>

                <div class="w-1.5 h-1.5 bg-[#00385F] rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-[#00385F] rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-[#00385F] rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-[#00385F] rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-[#00385F] rounded-full"></div>

            </div>


            <!-- Dot Grid Bawah Kanan -->
            <div class="absolute -bottom-8 -right-8 grid grid-cols-5 gap-2 opacity-80 z-0">

                <div class="w-1.5 h-1.5 bg-[#00385F] rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-[#00385F] rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-[#00385F] rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-[#00385F] rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-[#00385F] rounded-full"></div>

                <div class="w-1.5 h-1.5 bg-[#00385F] rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-[#00385F] rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-[#00385F] rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-[#00385F] rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-[#00385F] rounded-full"></div>

            </div>


            <!-- FRAME FOTO -->
            <div class="relative w-64 md:w-80 h-[22rem] md:h-[26rem] bg-[#FFC700] rounded-t-full overflow-hidden z-10 shadow-solid-lg border-4 border-[#00385F]">

                <img 
                    src="profile.png" 
                    alt="Felice Fernaldy" 
                    class="absolute -bottom-9 left-1/2 -translate-x-1/2 w-[150%] max-w-none h-[145%] object-contain"
                >

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="w-full max-w-6xl mx-auto text-center text-xs font-bold text-slate-400 py-4 z-10">
        © Felice Fernaldy • Portfolio
    </footer>

</body>
</html>
